name: Configurar correos y reglas de Firebase
on:
  workflow_dispatch:
    inputs:
      configure_emails:
        description: Intentar personalizar correos (Firebase puede restringirlos)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Leer versiones y permisos sin modificar datos
        env:
          ONLY_RULES: ${{ inputs.configure_emails && '0' || '1' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node security/audit-voice.cjs
