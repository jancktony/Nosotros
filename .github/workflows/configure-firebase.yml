name: Configurar correos y reglas de Firebase
on:
  workflow_dispatch:
    inputs:
      configure_emails:
        description: Intentar personalizar correos (Firebase puede restringirlos)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Configurar proyecto autorizado sin mostrar credenciales
        env:
          ONLY_RULES: ${{ inputs.configure_emails && '0' || '1' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node security/configure-firebase.cjs
      - name: Publicar panel web con acceso privado (Hosting gratuito)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/nosotros-hosting-credentials.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node security/prepare-web.cjs
          npx firebase deploy --only hosting --project nosotros-1e43a --non-interactive
