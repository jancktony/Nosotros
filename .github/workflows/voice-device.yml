name: Verificar audio comprimido en Android
on:
  push:
    branches: [feature/canal-interno-1.15.7, feature/recepcion-retencion-1.15.6, feature/recuperacion-walkie-1.15.5, feature/actividad-sueno-globo, feature/ajustes-buscar-ios, fix/conexion-direcciones-1.13, fix/reintento-directo-1.13.1, feature/voz-estable-juntos-1.14]
    paths: ['app/build.gradle.kts', 'app/src/main/java/com/tony/nosotros/voice/**', 'app/src/androidTest/**', 'voice-relay/**', 'security/run-voice-device.sh', '.github/workflows/voice-device.yml']
  workflow_dispatch:
concurrency:
  group: voice-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix voice-relay --no-audit --no-fund
      - name: Habilitar KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: npx firebase emulators:exec --only auth,firestore --project demo-nosotros 'bash security/run-voice-device.sh'
      - name: Detalle del emulador ficticio si falla voz
        if: failure()
        run: |
          if [ -f emulator-logcat.txt ]; then
            grep -E 'Firestore|PERMISSION_DENIED|UNAUTHENTICATED|DEADLINE|Write failed|Listen.*failed' emulator-logcat.txt | tail -80 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-device-test-results
          path: |
            app/build/reports/androidTests/connected/
            emulator-logcat.txt
            firestore-debug.log
            stream-fixture.log
          retention-days: 3
