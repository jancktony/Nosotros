name: Verificar audio comprimido en Android
on:
  push:
    branches: [feature/actividad-sueno-globo, feature/ajustes-buscar-ios, fix/conexion-direcciones-1.13, fix/reintento-directo-1.13.1, feature/voz-estable-juntos-1.14]
    paths: ['app/src/main/java/com/tony/nosotros/voice/**', 'app/src/androidTest/**', '.github/workflows/voice-device.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Habilitar KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: npx firebase emulators:exec --only auth,firestore --project demo-nosotros 'node security/seed-voice-emulators.cjs && ./gradlew connectedDebugAndroidTest -PcodecTest=1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-device-test-results
          path: app/build/reports/androidTests/connected/
          retention-days: 3
