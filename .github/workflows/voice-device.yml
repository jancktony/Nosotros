name: Verificar audio comprimido en Android
on:
  push:
    branches: [feature/experiencia-completa-1.16, feature/fiabilidad-y-viajes, feature/calidad-1.15.9, feature/recepcion-retencion-1.15.6, feature/recuperacion-walkie-1.15.5, feature/actividad-sueno-globo, feature/ajustes-buscar-ios, fix/conexion-direcciones-1.13, fix/reintento-directo-1.13.1, feature/voz-estable-juntos-1.14]
    paths: ['app/**', 'firestore.rules', '.github/workflows/voice-device.yml']
  workflow_dispatch:
concurrency:
  group: voice-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Habilitar KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: npx firebase emulators:exec --only auth,firestore --project demo-nosotros 'node security/seed-voice-emulators.cjs && (./gradlew connectedDebugAndroidTest -PcodecTest=1 -Pandroid.testInstrumentationRunnerArguments.class=com.tony.nosotros.voice.NoteDeliveryDeviceTest,com.tony.nosotros.voice.PendingVoiceDeviceTest,com.tony.nosotros.voice.VoiceCodecDeviceTest,com.tony.nosotros.voice.HoldGestureTest,com.tony.nosotros.voice.PeerConnectionDeviceTest,com.tony.nosotros.voice.DirectIdleDeviceTest,com.tony.nosotros.voice.RelayDeviceTest; CODE=$?; node security/inspect-voice-emulator.cjs; adb logcat -d > emulator-logcat.txt; exit $CODE)'
      - name: Detalle del emulador ficticio si falla voz
        if: failure()
        run: |
          if [ -f emulator-logcat.txt ]; then
            grep -E 'Firestore|PERMISSION_DENIED|UNAUTHENTICATED|DEADLINE|Write failed|Listen.*failed' emulator-logcat.txt | tail -80 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-device-test-results
          path: |
            app/build/reports/androidTests/connected/
            emulator-logcat.txt
            firestore-debug.log
          retention-days: 3
