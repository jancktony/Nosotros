name: Publicar versión Android
on:
  push:
    branches: [feature/experiencia-1.15.8, feature/recepcion-retencion-1.15.6, feature/recuperacion-walkie-1.15.5, feature/actividad-ficha-1.15.4, feature/juntos-animacion-1.15.3, feature/correcciones-mapa-1.15.2, feature/juntos-animado-1.15, main, feature/pruebas-web-walkie, feature/voz-estable-juntos-1.14]
  workflow_dispatch:
    inputs:
      ui_run_id:
        description: Prueba instrumental de esta revisión que debe aprobarse antes de publicar (opcional)
        required: false
        type: string
        default: ''
concurrency:
  group: android-candidates
  cancel-in-progress: ${{ github.ref_name == 'feature/experiencia-1.15.8' }}
permissions:
  contents: write
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$V" >> $GITHUB_OUTPUT
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "Nosotros-v$V.apk"; then
            echo "skip=1" >> $GITHUB_OUTPUT
          fi
      - if: steps.v.outputs.skip != '1'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - if: steps.v.outputs.skip != '1'
        name: Secretos
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$GS" > app/google-services.json
          echo "$KS" | base64 -d > app/nosotros.keystore
      - if: steps.v.outputs.skip != '1'
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease -PghRepo=${{ github.repository }}
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
      - if: steps.v.outputs.skip != '1' && github.event_name == 'workflow_dispatch' && inputs.ui_run_id != ''
        name: Exigir prueba instrumental aprobada de la misma revisión
        env:
          GH_TOKEN: ${{ github.token }}
          UI_RUN: ${{ inputs.ui_run_id }}
        run: |
          TEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UI_RUN" --jq '.head_sha')
          test "$TEST_SHA" = "$GITHUB_SHA"
          gh run watch "$UI_RUN" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
      - if: steps.v.outputs.skip != '1' && (github.ref_name == 'feature/voz-estable-juntos-1.14' || github.ref_name == 'feature/recuperacion-walkie-1.15.5' || github.ref_name == 'feature/recepcion-retencion-1.15.6')
        name: Exigir pruebas de voz de esta misma revisión
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=""
          for attempt in $(seq 1 30); do
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/voice-device.yml/runs?head_sha=$GITHUB_SHA&per_page=10" --jq '.workflow_runs | map(select(.head_sha == env.GITHUB_SHA)) | first | .id // empty')
            [ -n "$RUN" ] && break
            sleep 10
          done
          test -n "$RUN"
          TEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq '.head_sha')
          test "$TEST_SHA" = "$GITHUB_SHA"
          gh run watch "$RUN" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
      - if: steps.v.outputs.skip != '1' && github.ref_name == 'feature/juntos-animado-1.15'
        name: Exigir compilación, pruebas y reglas de esta misma revisión
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for WORKFLOW in security.yml web-and-rules.yml; do
            RUN=""
            for attempt in $(seq 1 90); do
              RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?head_sha=$GITHUB_SHA&per_page=10" --jq '.workflow_runs | map(select(.head_sha == env.GITHUB_SHA and .conclusion == "success")) | first | .id // empty')
              [ -n "$RUN" ] && break
              sleep 10
            done
            test -n "$RUN"
          done
      - if: steps.v.outputs.skip != '1' && (github.ref_name == 'feature/experiencia-1.15.8' || github.ref_name == 'feature/correcciones-mapa-1.15.2' || github.ref_name == 'feature/juntos-animacion-1.15.3' || github.ref_name == 'feature/actividad-ficha-1.15.4' || github.ref_name == 'feature/recuperacion-walkie-1.15.5')
        name: Exigir pruebas de interfaz y seguridad de esta misma revisión
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for WORKFLOW in security.yml map-device.yml; do
            RUN=""
            for attempt in $(seq 1 110); do
              RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?head_sha=$GITHUB_SHA&per_page=10" --jq '.workflow_runs | map(select(.head_sha == env.GITHUB_SHA and .conclusion == "success")) | first | .id // empty')
              [ -n "$RUN" ] && break
              sleep 10
            done
            test -n "$RUN"
          done
      - if: steps.v.outputs.skip != '1'
        run: cp app/build/outputs/apk/release/app-release.apk Nosotros-${{ steps.v.outputs.tag }}.apk
      - if: steps.v.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.v.outputs.tag }}
          files: Nosotros-${{ steps.v.outputs.tag }}.apk
          body: "Versión de prueba para el administrador. No liberada para la pareja."
      - if: steps.v.outputs.skip != '1'
        uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - if: steps.v.outputs.skip != '1'
        run: npm ci --no-audit --no-fund
      - if: steps.v.outputs.skip != '1'
        name: Publicar candidata privada sin liberarla a la pareja
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            node security/publish-update.cjs
          else
            echo '::error::Falta FIREBASE_SERVICE_ACCOUNT. No hay candidata privada disponible.'
            exit 1
          fi
      - if: steps.v.outputs.skip != '1' && steps.v.outputs.tag == 'v1.9.2'
        name: Habilitar únicamente el puente en el canal existente (no libera a la pareja)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.v.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
