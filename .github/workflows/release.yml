name: Publicar versión Android
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-candidates
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$V" >> $GITHUB_OUTPUT
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "Nosotros-v$V.apk"; then
            echo "skip=1" >> $GITHUB_OUTPUT
          fi
      - if: steps.v.outputs.skip != '1'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - if: steps.v.outputs.skip != '1'
        name: Secretos
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$GS" > app/google-services.json
          echo "$KS" | base64 -d > app/nosotros.keystore
      - if: steps.v.outputs.skip != '1'
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease -PghRepo=${{ github.repository }}
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
      - if: steps.v.outputs.skip != '1'
        run: cp app/build/outputs/apk/release/app-release.apk Nosotros-${{ steps.v.outputs.tag }}.apk
      - if: steps.v.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.v.outputs.tag }}
          files: Nosotros-${{ steps.v.outputs.tag }}.apk
          body: "Versión de prueba para el administrador. No liberada para la pareja."
      - if: steps.v.outputs.skip != '1'
        uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - if: steps.v.outputs.skip != '1'
        run: npm ci --no-audit --no-fund
      - if: steps.v.outputs.skip != '1'
        name: Publicar candidata privada sin liberarla a la pareja
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            node security/publish-update.cjs
          else
            echo '::error::Falta FIREBASE_SERVICE_ACCOUNT. No hay candidata privada disponible.'
            exit 1
          fi
