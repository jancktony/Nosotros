name: Validar y publicar web privada
on:
  push:
    branches: [fix/precision-lugares-1.17.1, feature/lugares-navegacion-1.17, feature/experiencia-completa-1.16, main, feature/experiencia-1.15.8, feature/juntos-animado-1.15, feature/pruebas-web-walkie, feature/actividad-sueno-globo, feature/ajustes-buscar-ios, fix/conexion-direcciones-1.13, fix/reintento-directo-1.13.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-rules
  cancel-in-progress: ${{ ((github.ref_name == 'fix/precision-lugares-1.17.1' || github.ref_name == 'feature/lugares-navegacion-1.17') || github.ref_name == 'feature/experiencia-completa-1.16') || github.ref_name == 'feature/experiencia-1.15.8' || github.ref_name == 'main' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci --no-audit --no-fund
      - run: node --test web/tests/*.test.cjs
      - run: npm test
      - run: node --check web/app.js
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Verificar temas y pantallas móvil y web
        run: |
          BROWSER_BIN=$(command -v google-chrome || command -v google-chrome-stable)
          PREVIEW_BROWSER_BIN="$BROWSER_BIN" node security/test-web-experience-browser.cjs
      - name: Aplicar reglas verificadas
        env:
          ONLY_RULES: '1'
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node security/configure-firebase.cjs
      - name: Publicar solo la web sin activar facturación
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/nosotros-hosting-credentials.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node security/prepare-web.cjs
          npx firebase deploy --only hosting --project nosotros-1e43a --non-interactive
