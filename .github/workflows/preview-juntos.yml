name: Vista previa privada del proceso de actualización
on:
  push:
    branches: [preview/instalacion-visible]
    paths: ['preview-juntos/**', 'security/test-design-preview.cjs', 'security/test-design-browser.cjs', '.github/workflows/preview-juntos.yml']
  workflow_dispatch:
concurrency:
  group: private-design-preview
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: node --check preview-juntos/app.js && node --check preview-juntos/install-preview.js && node --check preview-juntos/rediseno.js
      - run: npm install --no-save --package-lock=false jsdom@26 playwright@1.51.1
      - run: node security/test-design-preview.cjs
      - run: npx playwright install --with-deps chromium
      - run: node security/test-design-browser.cjs
      - name: Publicar solo un canal temporal, sin cambiar la app ni la web principal
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/preview-credential.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          node security/prepare-web.cjs
          cp web/config.js preview-juntos/config.js
          npx firebase hosting:channel:deploy juntos --expires 7d --project nosotros-1e43a --config preview-juntos/firebase.json --non-interactive
