name: Habilitar actualización en los dos teléfonos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Habilitar versión para ambas cuentas
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PERSONAL_EMAILS: ${{ secrets.PERSONAL_EMAILS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null
          node security/rollout.cjs
