<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Nosotros · Privado</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.css">
<style>
:root{--bg:#0b0f14;--card:#141a22;--line:#263040;--text:#f1f5f9;--sub:#9aa7b8;--me:#5eead4;--her:#f9a8d4;--warn:#fbbf24;--bad:#fca5a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:14px}
h1{font-size:22px;margin:6px 0}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.row{flex-wrap:wrap}.row .grow{min-width:120px}.row:first-of-type{border-top:0}
.grow{flex:1;min-width:0}.sub{color:var(--sub);font-size:13px}.big{font-size:26px;font-weight:700}
button{background:transparent;color:var(--me);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit} textarea{min-height:90px}button:disabled{opacity:.45;cursor:default}button.bad{color:var(--bad)}button:hover{border-color:currentColor}
.ok{color:var(--me);font-weight:700}.code{font-size:38px;font-weight:800;letter-spacing:6px;color:var(--me)}
#map{height:340px;border-radius:14px;overflow:hidden}
.photos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.photos figure{margin:0;background:var(--bg);border-radius:12px;overflow:hidden}.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.photos figcaption{padding:8px;font-size:12px}
.center{min-height:80vh;display:grid;place-items:center;text-align:center}
</style>
</head>
<body>
<main id="app"><div class="center"><p class="sub">Cargando…</p></div></main>
<script src="config.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.7.3/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
